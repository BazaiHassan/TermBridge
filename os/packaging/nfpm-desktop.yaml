# The desktop app as .deb/.rpm, built from os/ by `make packages` or the release workflow. They set
# ARCH and VERSION, and stage bin/pkg/termbridge-desktop and bin/pkg/io.termbridge.desktop.png
# (from `termbridge-desktop --write-icon`).
name: termbridge-desktop
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
section: net
priority: optional
maintainer: TermBridge <termbridge@users.noreply.github.com>
description: |-
  TermBridge desktop app: run it, scan the QR code with your phone, done.
  Reach this computer's terminal from your phone, end-to-end encrypted.
homepage: https://github.com/BazaiHassan/TermBridge
contents:
  - src: bin/pkg/termbridge-desktop
    dst: /usr/bin/termbridge-desktop
    file_info:
      mode: 0755
  - src: packaging/io.termbridge.desktop.desktop
    dst: /usr/share/applications/io.termbridge.desktop.desktop
    file_info:
      mode: 0644
  - src: bin/pkg/io.termbridge.desktop.png
    dst: /usr/share/icons/hicolor/256x256/apps/io.termbridge.desktop.png
    file_info:
      mode: 0644
scripts:
  postinstall: packaging/scripts/desktop-refresh.sh
  postremove: packaging/scripts/desktop-refresh.sh
# The binary links libGL, Wayland and xkbcommon (readelf NEEDED); GLFW loads the X11
# libraries at run time on X11 sessions, so those are only recommended.
overrides:
  deb:
    depends: [libc6, libgl1, libwayland-client0, libwayland-cursor0, libwayland-egl1, libxkbcommon0]
    recommends: [libx11-6, libx11-xcb1, libxcursor1, libxi6, libxinerama1, libxrandr2]
  rpm:
    depends:
      - libGL.so.1()(64bit)
      - libwayland-client.so.0()(64bit)
      - libwayland-cursor.so.0()(64bit)
      - libwayland-egl.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
    recommends:
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libXcursor.so.1()(64bit)
      - libXi.so.6()(64bit)
      - libXinerama.so.1()(64bit)
      - libXrandr.so.2()(64bit)
